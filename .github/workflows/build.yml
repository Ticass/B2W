name: Build portable packages

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The OpenAssetTools builds (the T4 tree is linked into the converter,
      # the T6 tools stay 32-bit) are restored when their sources are unchanged.
      - name: Restore the native tool builds
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/OpenAssetTools
            !vendor/OpenAssetTools/build/obj
            vendor/OpenAssetToolsT6/build/bin/Release_x86
            vendor/OpenAssetToolsT6/thirdparty
            tools/bin/xaudio_wma_decoder.exe
          key: windows-2022-native-v3-${{ hashFiles('vendor/OpenAssetTools.patch', 'vendor/OpenAssetToolsT6/src/**', 'vendor/OpenAssetToolsT6/tools/**', 'vendor/OpenAssetToolsT6/**/*.lua', 'vendor/OpenAssetToolsT6/raw/**', 'tools/restore_native.ps1', 'tools/build_audio_decoder.ps1', 'tools/xaudio_wma_decoder.cpp') }}
      - name: Build OpenAssetTools, the audio decoder and the converter
        run: ./tools/restore_native.ps1 -Projects 4 -Compilers 4
      - name: Cache the native tool builds
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/OpenAssetTools
            !vendor/OpenAssetTools/build/obj
            vendor/OpenAssetToolsT6/build/bin/Release_x86
            vendor/OpenAssetToolsT6/thirdparty
            tools/bin/xaudio_wma_decoder.exe
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Fetch pinned clang-tidy and FFmpeg
        run: |
          ./tools/fetch_wheel_binary.ps1 -Package clang-tidy -Version 22.1.7 -Member '*/bin/clang-tidy.exe' -Destination work/tools/clang-tidy.exe
          ./tools/fetch_wheel_binary.ps1 -Package imageio-ffmpeg -Version 0.6.0 -Member 'imageio_ffmpeg/binaries/ffmpeg-*.exe' -Destination tools/bin/ffmpeg.exe
      - name: Lint the converter
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsdev = Join-Path $install 'Common7/Tools/VsDevCmd.bat'
          cmd.exe /d /c "`"$vsdev`" -arch=x64 -host_arch=x64 >nul && cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && cmake --build native/build --target w2b_lint && native\build\w2b_lint.exe native/build --clang-tidy work\tools\clang-tidy.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the converter tests
        run: |
          native/build/w2b_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows
        run: ./tools/package_windows.ps1
      - name: Smoke-test the packaged converter
        run: |
          $bundle = 'work/desktop_dist/WawConverter'
          & "$bundle/waw2bo2n.exe" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "waw2bo2n usage exited $LASTEXITCODE" }
          $ledger = New-Item -ItemType Directory -Force work/smoke_ledger
          & "$bundle/waw2bo2n.exe" knowledge-report --ledger $ledger.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record provenance and checksum
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          $archive = 'work/desktop_dist/WawConverter-Windows.zip'
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  WawConverter-Windows.zip" | Set-Content "$archive.sha256" -Encoding utf8NoBOM
          @{
            commit = $env:SOURCE_SHA
            repository = '${{ github.repository }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content work/desktop_dist/build-info.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            work/desktop_dist/WawConverter-Windows.zip
            work/desktop_dist/WawConverter-Windows.zip.sha256
            work/desktop_dist/build-info.json
          if-no-files-found: error
          retention-days: 14

  # The same tested Windows programs, started through Wine by two launchers.
  linux:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: work/windows
      - name: Extract the tested Windows package
        run: |
          cd work/windows
          sha256sum --check WawConverter-Windows.zip.sha256
          unzip -q WawConverter-Windows.zip
      - name: Package Linux
        run: sh tools/package_linux.sh work/windows/WawConverter work/linux_dist
      - name: Check the extracted package
        run: |
          mkdir -p work/extracted
          tar -xzf work/linux_dist/WawConverter-Linux-x86_64.tar.gz -C work/extracted
          cd work/extracted/WawConverter-Linux
          test -x WawConverter && test -x WawConverter.CLI
          test -f B2W.exe && test -f waw2bo2n.exe && test -f src/waw2bo2/compat/gsc_api.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            work/linux_dist/WawConverter-Linux-x86_64.tar.gz
            work/linux_dist/WawConverter-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
