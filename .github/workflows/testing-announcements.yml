name: Discord testing build announcement

on:
  workflow_run:
    workflows: ['Preview builds']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful push build run ID to announce again
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: discord-testing-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  announce:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use the default-branch code, never the triggering branch or its artifacts.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Announce the completed testing build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TESTING_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID || '1557862642503254136' }}
          DISCORD_RELEASE_GUILD_ID: ${{ vars.DISCORD_RELEASE_GUILD_ID || '1557610224641245245' }}
        run: python -m services.discord_support.release_announcement
