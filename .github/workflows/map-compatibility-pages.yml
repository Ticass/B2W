name: Map compatibility Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'tools/build_map_compatibility_site.py'
      - '.github/workflows/map-compatibility-pages.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/build_map_compatibility_site.py'
      - '.github/workflows/map-compatibility-pages.yml'
  schedule:
    - cron: '29 7 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened]

permissions:
  contents: read

concurrency:
  group: map-compatibility-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate map catalog from CodRepo and compatibility records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/build_map_compatibility_site.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
