name: Nightly and version releases

# Fixes are built and tested on their own branches (Preview builds), then merged
# into main by hand. At midnight Toronto time the nightly is cut from main and
# released; a night without new commits on main publishes nothing. Pushing a
# v* tag publishes a stable release through the same packaging pipeline.
on:
  schedule:
    # Midnight in Toronto: 04:00 UTC during daylight saving time, 05:00 UTC
    # during standard time. The resolve job keeps whichever is midnight.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  # A manual nightly from main, built even without new commits.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  # Picks the commit and release name. Nightlies build main's commit from the
  # triggering event (a rerun keeps it); tag pushes build the tag's commit.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      previous: ${{ steps.resolve.outputs.previous }}
      nightly: ${{ steps.resolve.outputs.nightly }}
    steps:
      - name: Resolve the release commit
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const nightly = context.eventName !== 'push';
            core.setOutput('nightly', String(nightly));
            core.setOutput('sha', context.sha);
            if (!nightly) {
              const tag = context.ref.replace('refs/tags/', '');
              core.setOutput('tag', tag);
              core.setOutput('name', tag);
              core.setOutput('release', 'true');
              return;
            }
            const { data: info } = await github.rest.repos.get(repo);
            if (context.ref !== `refs/heads/${info.default_branch}`) {
              core.setFailed(`Nightlies are cut from ${info.default_branch}; this run is on ${context.ref}.`);
              return;
            }
            if (context.eventName === 'schedule') {
              const offset = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Toronto', timeZoneName: 'shortOffset'
              }).formatToParts(new Date()).find(part => part.type === 'timeZoneName').value;
              const midnight = offset === 'GMT-4' ? '0 4 * * *' : '0 5 * * *';
              if (context.payload.schedule !== midnight) {
                core.info(`Toronto is ${offset}; ${context.payload.schedule} is not midnight. Skipping.`);
                core.setOutput('release', 'false');
                return;
              }
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const previous = releases
              .filter(r => !r.draft && r.published_at && r.tag_name.startsWith('nightly-'))
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0];
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: context.runId });
            const tag = `nightly-${new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date(run.created_at))}-${context.runId}`;
            if (previous && previous.tag_name !== tag) {
              core.setOutput('previous', previous.tag_name);
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...repo, basehead: `${previous.tag_name}...${context.sha}`, per_page: 1
              });
              if (context.eventName === 'schedule' && comparison.status !== 'ahead') {
                core.info(`main is ${comparison.status} relative to ${previous.tag_name}; no nightly tonight.`);
                core.setOutput('release', 'false');
                return;
              }
            }
            core.setOutput('tag', tag);
            core.setOutput('name', `Nightly ${tag.slice('nightly-'.length, 'nightly-'.length + 10)}`);
            core.setOutput('release', 'true');

  packages:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_NAME: ${{ needs.resolve.outputs.name }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      NIGHTLY: ${{ needs.resolve.outputs.nightly }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: assets
      - name: Verify release assets
        working-directory: assets
        run: |
          sha256sum --check WawConverter-Windows.zip.sha256
          sha256sum --check WawConverter-Linux-x86_64.tar.gz.sha256
          test -s build-info.json
      - name: Publish tested packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY" == true ]]; then
            printf 'Development preview cut from `main` at commit `%s`.\n' "$SOURCE_SHA" > notes.md
            if [[ -n "$PREVIOUS_TAG" ]]; then
              printf '\nChanges since %s: https://github.com/%s/compare/%s...%s\n' "$PREVIOUS_TAG" "$GH_REPO" "$PREVIOUS_TAG" "$SOURCE_SHA" >> notes.md
            fi
            flags=(--prerelease --latest=false)
          else
            printf 'Built and tested from commit `%s`. See CHANGELOG.md for changes.\n' "$SOURCE_SHA" > notes.md
            flags=(--latest)
          fi
          # Query the full list so API errors cannot be mistaken for a missing release.
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$existing"; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "$RELEASE_NAME" --notes-file notes.md --draft "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          printf 'Published [%s](%s) from `%s`.\n' "$RELEASE_TAG" "$url" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  announce:
    needs: [resolve, publish]
    if: needs.resolve.outputs.nightly == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Announce the published nightly on Discord
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.tag }}
          NIGHTLY_SOURCE_BRANCH: main
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID || '1557862642503254136' }}
          DISCORD_RELEASE_GUILD_ID: ${{ vars.DISCORD_RELEASE_GUILD_ID || '1557610224641245245' }}
        run: python -m services.discord_support.release_announcement
