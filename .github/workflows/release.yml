name: Nightly and version releases

on:
  schedule:
    # 02:17 Toronto during daylight saving time; 01:17 during standard time.
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.snapshot.outputs.tag }}
      branch: ${{ steps.snapshot.outputs.branch }}
      nightly: ${{ steps.snapshot.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Freeze the nightly release branch
        id: snapshot
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const nightly = context.eventName !== 'push';
            core.setOutput('nightly', String(nightly));
            if (!nightly) {
              core.setOutput('tag', context.ref.replace('refs/tags/', ''));
              core.setOutput('branch', '');
              return;
            }
            // A rerun uses the same name, date and original event commit.
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            const date = run.created_at.slice(0, 10);
            const branch = `release/nightly/${date}-${context.runId}`;
            const sha = process.env.SOURCE_SHA;
            try {
              const { data: existing } = await github.rest.git.getRef({
                ...context.repo, ref: `heads/${branch}`
              });
              if (existing.object.sha !== sha) {
                throw new Error(`Snapshot branch ${branch} no longer points to ${sha}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/heads/${branch}`, sha
              });
            }
            core.setOutput('branch', branch);
            core.setOutput('tag', `nightly-${date}-${context.runId}`);

  packages:
    needs: snapshot
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.snapshot.outputs.sha }}

  publish:
    needs: [snapshot, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.snapshot.outputs.tag }}
      SOURCE_SHA: ${{ needs.snapshot.outputs.sha }}
      RELEASE_BRANCH: ${{ needs.snapshot.outputs.branch }}
      NIGHTLY: ${{ needs.snapshot.outputs.nightly }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: assets
      - name: Verify release assets
        working-directory: assets
        run: |
          sha256sum --check WawConverter-Windows.zip.sha256
          sha256sum --check WawConverter-Linux-x86_64.tar.gz.sha256
          test -s build-info.json
      - name: Publish tested packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY" == true ]]; then
            title="Nightly ${RELEASE_TAG#nightly-}"
            printf 'Development preview built from `%s` at commit `%s`.\n\nCommits after this snapshot are included in the next nightly.\n' "$RELEASE_BRANCH" "$SOURCE_SHA" > notes.md
            flags=(--prerelease --latest=false)
          else
            title="$RELEASE_TAG"
            printf 'Built and tested from commit `%s`. See CHANGELOG.md for changes.\n' "$SOURCE_SHA" > notes.md
            flags=(--latest)
          fi
          # Query the full list so API errors cannot be mistaken for a missing release.
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$existing"; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "$title" --notes-file notes.md --draft "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          printf 'Published [%s](%s) from `%s`.\n' "$RELEASE_TAG" "$url" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
