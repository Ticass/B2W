name: Build Linux release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag containing the Windows ZIP
        required: true
        default: v0.2.13
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download the Windows release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p work/windows
          gh release download "$RELEASE_TAG" --pattern WawConverter-Windows.zip --dir work/windows
          unzip -q work/windows/WawConverter-Windows.zip -d work/windows
      - name: Assemble the Linux release
        run: sh tools/package_linux.sh work/windows/WawConverter work/linux_dist
      - name: Check the extracted package
        run: |
          mkdir -p work/extracted
          tar -xzf work/linux_dist/WawConverter-Linux-x86_64.tar.gz -C work/extracted
          cd work/extracted/WawConverter-Linux
          test -x WawConverter && test -x WawConverter.CLI
          test -f B2W.exe && test -f waw2bo2n.exe
      - name: Upload Linux release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" work/linux_dist/WawConverter-Linux-x86_64.tar.gz work/linux_dist/WawConverter-Linux-x86_64.tar.gz.sha256 --clobber
