name: Bleeding edge builds

on:
  push:
    branches:
      - '**'
      # Release branches only produce the midnight nightly (release.yml).
      - '!release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep every pushed commit's build; do not cancel an older build on a new push.
# A release/** branch never gets a bleeding edge build, whether pushed, opened as
# a pull request, or run by hand; it is built only as the nightly.
jobs:
  map-catalog:
    if: ${{ !startsWith(github.head_ref, 'release/') && !startsWith(github.ref_name, 'release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate the CodRepo map catalog
        run: python tools/build_map_compatibility_site.py --output _site

  packages:
    if: ${{ !startsWith(github.head_ref, 'release/') && !startsWith(github.ref_name, 'release/') }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
