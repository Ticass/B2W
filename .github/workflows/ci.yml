name: Preview builds

# Every push to a fix branch gets a preview (testing) build and a Discord
# testing announcement. main never does: it is only built by the midnight
# nightly (release.yml), after tested fixes are merged into it.
on:
  push:
    branches-ignore:
      - main
  # Draft fix PRs opened by the Discord investigation dispatch their branch here.
  workflow_dispatch:

permissions:
  contents: read

# Keep every pushed commit's build; do not cancel an older build on a new push.
jobs:
  map-catalog:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate the CodRepo map catalog
        run: python tools/build_map_compatibility_site.py --output _site

  packages:
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
