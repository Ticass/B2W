name: Discord support bot checks

on:
  push:
    paths:
      - 'services/discord_support/**'
      - 'tools/discord_agent_pipeline.py'
      - '.github/discord-agent-*'
      - '.github/workflows/discord-*.yml'
      - '.dockerignore'
      - '.github/workflows/testing-announcements.yml'
      - '.github/workflows/release-announcements.yml'
  pull_request:
    paths:
      - 'services/discord_support/**'
      - 'tools/discord_agent_pipeline.py'
      - '.github/discord-agent-*'
      - '.github/workflows/discord-*.yml'
      - '.dockerignore'
      - '.github/workflows/testing-announcements.yml'
      - '.github/workflows/release-announcements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/discord_support/requirements.txt
      - name: Test report recovery, diagnostics parsing and patch boundaries
        run: python -m unittest discover -s services/discord_support/tests
      - name: Validate container configuration and build the listener image
        run: |
          cp services/discord_support/.env.example services/discord_support/.env
          docker compose -f services/discord_support/compose.yml config --quiet
          docker build -f services/discord_support/Dockerfile -t discord-support:test .
