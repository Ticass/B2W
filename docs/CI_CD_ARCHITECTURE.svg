<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440" role="img" aria-labelledby="title description">
  <title id="title">WawConverter delivery and support process</title>
  <desc id="description">A product requirements style process map for WawConverter. It shows push and pull request validation, scheduled nightly snapshots, tagged stable releases, daily release announcements, Discord error intake with a GitHub-hosted investigation agent and human review gate, and map compatibility reports updating GitHub Pages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#77869b"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d78c5"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7856b5"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34856d"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b07d22"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16243a" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#18263a}.canvas{fill:#f5f7fb}.white{fill:#fff}.lane{fill:#fff;stroke:#dce3ed;stroke-width:1.5}.laneHead{fill:#edf2f8}.card{fill:#fff;stroke:#cfd9e6;stroke-width:1.5}.blue{fill:#f1f6fd;stroke:#3d78c5;stroke-width:2}.purple{fill:#f6f3fc;stroke:#7856b5;stroke-width:2}.green{fill:#eff8f4;stroke:#34856d;stroke-width:2}.amber{fill:#fff8e9;stroke:#b07d22;stroke-width:2}.gray{fill:#f4f6f9;stroke:#8593a6;stroke-width:1.5}.heading{font-size:35px;font-weight:750;letter-spacing:-.6px;fill:#142338}.subheading{font-size:16px;fill:#65758a}.laneTitle{font-size:16px;font-weight:750;letter-spacing:1.3px;fill:#34465f}.laneNum{font-size:12px;font-weight:800;letter-spacing:1px;fill:#fff}.cardTitle{font-size:17px;font-weight:720;fill:#18263a}.body{font-size:14px;fill:#43536a}.small{font-size:12px;fill:#65758a}.tiny{font-size:11px;fill:#65758a}.tag{font-size:10px;font-weight:750;letter-spacing:.8px}.column{font-size:11px;font-weight:750;letter-spacing:1px;fill:#7a899d}.line{fill:none;stroke:#77869b;stroke-width:2.5;marker-end:url(#arrow)}.lineBlue{fill:none;stroke:#3d78c5;stroke-width:2.5;marker-end:url(#arrowBlue)}.linePurple{fill:none;stroke:#7856b5;stroke-width:2.5;marker-end:url(#arrowPurple)}.lineGreen{fill:none;stroke:#34856d;stroke-width:2.5;marker-end:url(#arrowGreen)}.lineAmber{fill:none;stroke:#b07d22;stroke-width:2.5;marker-end:url(#arrowAmber)}.dash{stroke-dasharray:7 6}.label{font-size:11px;font-weight:650;fill:#64758b}.foot{font-size:12px;fill:#596b83}
    </style>
  </defs>
  <rect class="canvas" width="1920" height="1440"/>

  <!-- Document header -->
  <text x="64" y="65" class="heading">WawConverter | Delivery &amp; support operating model</text>
  <text x="66" y="96" class="subheading">PRD process map · triggers, automated work, release gates, and user-facing outcomes</text>
  <rect x="1470" y="42" width="386" height="62" rx="12" fill="#fff" stroke="#dce3ed"/>
  <circle cx="1495" cy="64" r="6" fill="#3d78c5"/><text x="1510" y="68" class="small">GitHub-hosted automation</text>
  <circle cx="1690" cy="64" r="6" fill="#7856b5"/><text x="1705" y="68" class="small">Discord-facing flow</text>
  <circle cx="1495" cy="86" r="6" fill="#34856d"/><text x="1510" y="90" class="small">Published compatibility data</text>
  <circle cx="1690" cy="86" r="6" fill="#b07d22"/><text x="1705" y="90" class="small">Release gate</text>

  <!-- Lane 1 -->
  <rect x="48" y="128" width="1824" height="498" rx="16" class="lane"/>
  <path d="M64 128H1856a16 16 0 0 1 16 16v42H48v-42a16 16 0 0 1 16-16z" class="laneHead"/>
  <circle cx="80" cy="157" r="14" fill="#3d78c5"/><text x="76" y="161" class="laneNum">01</text>
  <text x="105" y="163" class="laneTitle">CODE DELIVERY &amp; RELEASE TRACKS</text>
  <text x="1510" y="161" class="small">All build / test / publish jobs run on GitHub-hosted runners</text>

  <text x="78" y="207" class="column">TRIGGER</text>
  <text x="401" y="207" class="column">AUTOMATED BUILD &amp; VALIDATION</text>
  <text x="1000" y="207" class="column">OUTPUT TRACK</text>
  <text x="1435" y="207" class="column">DAILY RELEASE DIGEST</text>

  <!-- CI row -->
  <rect x="76" y="222" width="270" height="94" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="98" y="252" class="cardTitle">Branch push or pull request</text>
  <text x="98" y="279" class="body">Runs for every pushed commit</text>
  <text x="98" y="301" class="small">PR checks test the proposed merge commit</text>
  <rect x="400" y="222" width="485" height="94" rx="12" class="card" filter="url(#shadow)"/>
  <text x="423" y="252" class="cardTitle">Reusable package workflow</text>
  <text x="423" y="279" class="body">Windows native build + regression tests + Windows package</text>
  <text x="423" y="301" class="body">Ubuntu packages Linux and smoke-tests the Linux frontend</text>
  <rect x="950" y="222" width="344" height="94" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="973" y="252" class="cardTitle">Testing build artifacts</text>
  <text x="973" y="279" class="body">Windows + Linux packages on the Actions run</text>
  <text x="973" y="301" class="small">Kept for 14 days · no release is published</text>
  <path d="M346 269H400" class="lineBlue"/><path d="M885 269H950" class="lineBlue"/>

  <!-- Nightly row -->
  <rect x="76" y="334" width="270" height="112" rx="12" class="amber" filter="url(#shadow)"/>
  <text x="98" y="365" class="cardTitle">Daily schedule · 06:17 UTC</text>
  <text x="98" y="392" class="body">Uses the default-branch commit at trigger</text>
  <text x="98" y="417" class="small">Later commits roll into tomorrow’s nightly</text>
  <rect x="400" y="334" width="245" height="112" rx="12" class="amber" filter="url(#shadow)"/>
  <text x="420" y="365" class="cardTitle">Freeze snapshot</text>
  <text x="420" y="392" class="body">Create immutable branch:</text>
  <text x="420" y="417" class="small">release/nightly/date-run</text>
  <rect x="680" y="334" width="270" height="112" rx="12" class="card" filter="url(#shadow)"/>
  <text x="701" y="365" class="cardTitle">Build + validate snapshot</text>
  <text x="701" y="392" class="body">Same Windows and Linux checks</text>
  <text x="701" y="417" class="small">Failed checks → no published release</text>
  <rect x="985" y="334" width="309" height="112" rx="12" class="amber" filter="url(#shadow)"/>
  <text x="1008" y="365" class="cardTitle">Nightly prerelease</text>
  <text x="1008" y="392" class="body">Dated release with both packages</text>
  <text x="1008" y="417" class="small">Checksums + source commit provenance</text>
  <path d="M346 390H400" class="lineAmber"/><path d="M645 390H680" class="lineAmber"/><path d="M950 390H985" class="lineAmber"/>

  <!-- Stable row -->
  <rect x="76" y="464" width="270" height="94" rx="12" class="green" filter="url(#shadow)"/>
  <text x="98" y="494" class="cardTitle">Version tag pushed · vX.Y.Z</text>
  <text x="98" y="521" class="body">Maintainer prepares version + changelog</text>
  <text x="98" y="543" class="small">Tag triggers the release workflow</text>
  <rect x="400" y="464" width="485" height="94" rx="12" class="card" filter="url(#shadow)"/>
  <text x="423" y="494" class="cardTitle">Build + validate tagged source</text>
  <text x="423" y="521" class="body">Same Windows and Linux package checks</text>
  <text x="423" y="543" class="small">Publish gate opens only after package jobs pass</text>
  <rect x="950" y="464" width="344" height="94" rx="12" class="green" filter="url(#shadow)"/>
  <text x="973" y="494" class="cardTitle">Stable GitHub release</text>
  <text x="973" y="521" class="body">Latest version · Windows + Linux</text>
  <text x="973" y="543" class="small">Release assets include checksums</text>
  <path d="M346 511H400" class="lineGreen"/><path d="M885 511H950" class="lineGreen"/>

  <!-- Digest collector and notification -->
  <rect x="1350" y="222" width="474" height="336" rx="14" class="purple" filter="url(#shadow)"/>
  <text x="1377" y="255" class="cardTitle">Daily release announcement · 15:17 UTC</text>
  <text x="1377" y="287" class="body">Scheduled GitHub Action reads:</text>
  <rect x="1377" y="305" width="420" height="35" rx="8" fill="#fff" stroke="#ddd5ed"/><text x="1392" y="328" class="body">Latest stable release</text>
  <rect x="1377" y="349" width="420" height="35" rx="8" fill="#fff" stroke="#ddd5ed"/><text x="1392" y="372" class="body">Latest successful nightly release</text>
  <rect x="1377" y="393" width="420" height="35" rx="8" fill="#fff" stroke="#ddd5ed"/><text x="1392" y="416" class="body">Latest successful testing build</text>
  <rect x="1377" y="437" width="420" height="35" rx="8" fill="#fff" stroke="#ddd5ed"/><text x="1392" y="460" class="body">Commit notes since prior nightly</text>
  <path d="M1294 269H1320V492H1350" class="linePurple"/>
  <path d="M1294 390H1320" class="linePurple"/>
  <path d="M1294 511H1320" class="linePurple"/>
  <rect x="1377" y="489" width="420" height="48" rx="9" fill="#7856b5"/>
  <text x="1394" y="519" font-size="14" font-weight="700" fill="#fff">Posts digest to Discord release channel</text>

  <rect x="76" y="579" width="1748" height="28" rx="8" fill="#f4f6f9"/>
  <text x="92" y="598" class="small">Release gate: passing runner checks are required to publish. A merged change reaches a later nightly snapshot; stable releases require an explicit version tag.</text>

  <!-- Lane 2 -->
  <rect x="48" y="650" width="1824" height="382" rx="16" class="lane"/>
  <path d="M64 650H1856a16 16 0 0 1 16 16v42H48v-42a16 16 0 0 1 16-16z" class="laneHead"/>
  <circle cx="80" cy="679" r="14" fill="#7856b5"/><text x="76" y="683" class="laneNum">02</text>
  <text x="105" y="685" class="laneTitle">DISCORD ERROR REPORT → INVESTIGATION → REVIEWED FIX</text>
  <text x="1473" y="683" class="small">The bot stays online on Railway; investigation runs on GitHub</text>

  <text x="78" y="731" class="column">REPORT INTAKE</text><text x="397" y="731" class="column">TRACKING</text><text x="700" y="731" class="column">AUTOMATED INVESTIGATION</text><text x="1120" y="731" class="column">DECISION / RESPONSE</text><text x="1510" y="731" class="column">CODE RELEASE</text>

  <rect x="76" y="750" width="260" height="150" rx="12" class="purple" filter="url(#shadow)"/>
  <text x="98" y="783" class="cardTitle">Discord error forum</text>
  <text x="98" y="812" class="body">Member posts error + evidence</text>
  <text x="98" y="841" class="body">Human replies add context</text>
  <text x="98" y="874" class="small">Forum thread is the conversation</text>

  <rect x="384" y="750" width="250" height="150" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="406" y="783" class="cardTitle">Railway Discord bot</text>
  <text x="406" y="812" class="body">Forwards thread to one issue</text>
  <text x="406" y="841" class="body">Delivers agent replies back</text>
  <text x="406" y="874" class="small">Persistent listener + delivery state</text>

  <rect x="682" y="750" width="250" height="150" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="704" y="783" class="cardTitle">GitHub issue opens</text>
  <text x="704" y="812" class="body">Issue event starts workflow</text>
  <text x="704" y="841" class="body">Follow-up comments retrigger</text>
  <text x="704" y="874" class="small">Labels + markers scope automation</text>

  <rect x="980" y="750" width="340" height="150" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="1002" y="783" class="cardTitle">Codex investigation agent</text>
  <text x="1002" y="812" class="body">Ubuntu runner reads source + diagnostics</text>
  <text x="1002" y="841" class="body">Findings / question, or proposed patch</text>
  <text x="1002" y="874" class="small">Patch boundary + regression tests validated</text>

  <rect x="1368" y="750" width="240" height="150" rx="12" class="purple" filter="url(#shadow)"/>
  <text x="1390" y="783" class="cardTitle">Human review gate</text>
  <text x="1390" y="812" class="body">Agent opens draft PR</text>
  <text x="1390" y="841" class="body">Maintainer reviews + merges</text>
  <text x="1390" y="874" class="small">Agent never merges code</text>

  <rect x="1652" y="750" width="174" height="150" rx="12" class="green" filter="url(#shadow)"/>
  <text x="1672" y="783" class="cardTitle">main</text>
  <text x="1672" y="812" class="body">Merged fix</text>
  <text x="1672" y="841" class="body">Next CI + nightly</text>
  <text x="1672" y="874" class="small">Stable by tag</text>

  <path d="M336 825H384" class="linePurple"/><path d="M634 825H682" class="lineBlue"/><path d="M932 825H980" class="lineBlue"/><path d="M1320 825H1368" class="linePurple"/><path d="M1608 825H1652" class="lineGreen"/>
  <path d="M1100 900V947H508V900" class="linePurple dash"/>
  <rect x="648" y="926" width="327" height="32" rx="8" fill="#fff" stroke="#ddd5ed"/><text x="666" y="947" class="label">Question / findings return through the issue to the same Discord thread</text>
  <path d="M1738 750V615H80V558" class="lineGreen dash"/>
  <text x="736" y="601" class="label">Merged code re-enters the release pipeline</text>
  <rect x="76" y="974" width="1750" height="36" rx="9" fill="#f4f6f9"/>
  <text x="94" y="998" class="small">Failure path: no patch → findings or a request for more information. Patch path: validate → draft PR → human merge → CI → future release.</text>

  <!-- Lane 3 -->
  <rect x="48" y="1056" width="1824" height="300" rx="16" class="lane"/>
  <path d="M64 1056H1856a16 16 0 0 1 16 16v42H48v-42a16 16 0 0 1 16-16z" class="laneHead"/>
  <circle cx="80" cy="1085" r="14" fill="#34856d"/><text x="76" y="1089" class="laneNum">03</text>
  <text x="105" y="1091" class="laneTitle">MAP COMPATIBILITY REPORT → AUTOMATIC PAGE UPDATE</text>
  <text x="1415" y="1089" class="small">Community evidence stays separate from maintainer-verified status</text>

  <rect x="76" y="1130" width="300" height="150" rx="12" class="purple" filter="url(#shadow)"/>
  <text x="100" y="1163" class="cardTitle">Discord · /map-report</text>
  <text x="100" y="1192" class="body">Search CodRepo map catalog</text>
  <text x="100" y="1221" class="body">Playable / broken + test form</text>
  <text x="100" y="1252" class="small">Version · platform · notes · evidence</text>

  <rect x="430" y="1130" width="275" height="150" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="454" y="1163" class="cardTitle">Railway bot</text>
  <text x="454" y="1192" class="body">Matches CodRepo map ID</text>
  <text x="454" y="1221" class="body">Creates public report issue</text>
  <text x="454" y="1252" class="small">Evidence links retained with issue</text>

  <rect x="760" y="1130" width="286" height="150" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="784" y="1163" class="cardTitle">Map issue changes</text>
  <text x="784" y="1192" class="body">Opened · edited · reopened · closed</text>
  <text x="784" y="1221" class="body">Starts Pages build on runner</text>
  <text x="784" y="1252" class="small">Daily CodRepo base refresh also runs</text>

  <rect x="1100" y="1130" width="310" height="150" rx="12" class="green" filter="url(#shadow)"/>
  <text x="1124" y="1163" class="cardTitle">Generate static catalog</text>
  <text x="1124" y="1192" class="body">CodRepo base + curated statuses</text>
  <text x="1124" y="1221" class="body">Add unverified community reports</text>
  <text x="1124" y="1252" class="small">Build HTML + downloadable maps.json</text>

  <rect x="1464" y="1130" width="362" height="150" rx="12" class="green" filter="url(#shadow)"/>
  <text x="1488" y="1163" class="cardTitle">GitHub Pages compatibility site</text>
  <text x="1488" y="1192" class="body">Map search · compile / play status</text>
  <text x="1488" y="1221" class="body">Community playable / broken reports</text>
  <text x="1488" y="1252" class="small">New report appears after Pages deploy</text>
  <path d="M376 1205H430" class="linePurple"/><path d="M705 1205H760" class="lineBlue"/><path d="M1046 1205H1100" class="lineGreen"/><path d="M1410 1205H1464" class="lineGreen"/>

  <!-- Footer -->
  <text x="64" y="1400" class="foot">Operating boundaries: GitHub Actions runners are temporary; Railway runs only the always-on Discord listener; human approval is required before fixes merge.</text>
  <text x="1660" y="1400" class="tiny">PROCESS MAP · REV 1.0</text>
</svg>
