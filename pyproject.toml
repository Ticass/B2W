[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waw2bo2"
version = "0.1.0"
description = "Fail-closed World at War custom-map to Black Ops II zone conversion pipeline"
requires-python = ">=3.11"

[project.scripts]
waw2bo2 = "waw2bo2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

